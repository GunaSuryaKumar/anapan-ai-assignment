<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competitive Intelligence Tool</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4 text-center rainbow-text">Competitive Intelligence Tool</h1>
        <div class="mb-3 d-flex gap-2 flex-wrap justify-content-center">
            <input type="text" id="searchInput" class="form-control search-input" placeholder="Search competitor (e.g., TCS)">
            <button id="search-btn" class="btn search-btn"><i class="fas fa-search"></i> Search</button>
            <button id="reset-btn" class="btn reset-btn"><i class="fas fa-undo"></i> Reset</button>
        </div>
        <div class="table-container">
            <div class="d-flex justify-content-end mb-2">
                <button id="fullscreen-btn" class="btn fullscreen-btn"><i class="fas fa-expand"></i> Full Screen</button>
            </div>
            <div id="loading-spinner" class="text-center d-none">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <table class="table table-striped" id="competitorTable">
                <thead>
                    <tr>
                        <th>Competitor</th>
                        <th>Description</th>
                        <th>Source</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div class="text-center">
            <button id="export-btn" class="btn export-btn"><i class="fas fa-download"></i> Export as CSV</button>
        </div>
    </div>
    <footer class="text-center mt-5 py-3">
        <p class="rainbow-text">Powered by Competitive Intelligence | Created by K Guna Surya Kumar</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
